<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151b15">
  <meta name="description" content="A full-screen analog TV test card with digital rain, static, and optional receiver audio.">
  <title>Test Pattern</title>
  <link rel="stylesheet" href="./signal.css">
  <script src="./signal.js" defer></script>
</head>
<body>
  <main class="screen" id="screen" aria-label="TV test screen">
    <canvas id="raster" class="raster" aria-hidden="true"></canvas>
    <h1>Please stand by</h1>
    <canvas id="interference" class="interference" aria-hidden="true"></canvas>
    <div class="glass" aria-hidden="true"></div>
    <button type="button" id="sound" class="sound" aria-label="Receiver sound" aria-pressed="false" title="Turn sound on" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M11 3 6 7H3v6h3l5 4V3Z"/>
        <path d="m14 7 4 6m0-6-4 6" class="muted-icon"/>
        <path d="M14 7a5 5 0 0 1 0 6m2-8a7 7 0 0 1 0 10" class="sound-icon"/>
      </svg>
    </button>
  </main>
</body>
</html>
